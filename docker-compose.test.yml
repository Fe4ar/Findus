# Isolated test stack for restore tests and pre-deploy checks: https://<WIKI_HOST>:9443
# Standalone on purpose (do NOT combine with docker-compose.yml via -f): its own project and its own volumes,
# so it can never touch the live tnc-wiki_* volumes. No OnlyOffice/draw.io; those pages show an error here.
#   docker compose -f docker-compose.test.yml up -d --build
#   scripts/restore.sh ~/findus-backups/<date>          (restores into this stack by default)
#   docker compose -f docker-compose.test.yml down -v   (removes the test stack and its data)
name: findus-test

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 5s
      retries: 20

  web:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MEDIA_ROOT: /data/media
      WIKI_ALIASES: ""
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    environment:
      WIKI_HOST: ${WIKI_HOST:-localhost}
      WIKI_ALIASES: ""
    ports:
      - "9443:443"
    depends_on:
      - web

# No "name:" here: compose prefixes them with the project, e.g. findus-test_pgdata.
volumes:
  pgdata:
  media:
