name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: wiki
          POSTGRES_USER: wiki
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wiki -d wiki" --health-interval 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci
      ONLYOFFICE_JWT_SECRET: test-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  public-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-public.sh .
