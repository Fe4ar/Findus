# Creates the GitHub release for a pushed tag vX.Y.Z with the notes from CHANGELOG.md.
name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches frontend/package.json
        run: test "v$(jq -r .version frontend/package.json)" = "$GITHUB_REF_NAME"
      - name: Build check
        run: cd frontend && npm ci && npm run build
      - name: Notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Findus ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
